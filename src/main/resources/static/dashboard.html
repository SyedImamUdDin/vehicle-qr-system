<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehicle QR - Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
        }

        .logout-button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #e5e7eb;
        }

        .logout-button:hover {
            background: #d1d5db;
        }


        /* =========================
           ADD VEHICLE
        ========================= */

        .add-section {
            margin-bottom: 20px;
        }

        .add-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .add-button:hover {
            background: #1d4ed8;
        }


        /* =========================
           VEHICLES
        ========================= */

        .section-title {
            margin-bottom: 15px;
            font-size: 21px;
        }

        .vehicle-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .vehicle-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .vehicle-info {
            margin-bottom: 7px;
            color: #555;
        }


        /* =========================
           QR CODE
        ========================= */

        .qr-container {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .qr-container img {
            width: 220px;
            height: 220px;
            max-width: 100%;
            object-fit: contain;
        }

        .qr-container p {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .vehicle-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .action-button {
            padding: 11px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        .action-button:hover {
            opacity: 0.9;
        }

        .public-button {
            background: #2563eb;
            color: white;
        }

        .qr-button {
            background: #7c3aed;
            color: white;
        }

        .contact-button {
            background: #dc2626;
            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
        }

        .delete-button {
            background: #374151;
            color: white;
        }


        /* =========================
           LOADING / EMPTY
        ========================= */

        .loading {
            text-align: center;
            padding: 30px;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .logout-button {
                width: 100%;
            }

            .vehicle-actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div>

            <h1>🚗 Vehicle QR</h1>

            <p>
                Welcome,
                <strong id="userName">User</strong> 👋
            </p>

        </div>


        <button
                class="logout-button"
                onclick="logout()">

            Logout

        </button>

    </div>


    <!-- =========================
         ADD VEHICLE
    ========================= -->

    <div class="add-section">

        <button
                class="add-button"
                onclick="addVehicle()">

            ➕ Add Vehicle

        </button>

    </div>


    <!-- =========================
         VEHICLES
    ========================= -->

    <h2 class="section-title">
        My Vehicles
    </h2>


    <div id="vehiclesContainer">

        <div class="loading">
            Loading vehicles...
        </div>

    </div>


</div>


<script>


    // ==========================================
    // GET LOGGED-IN USER
    // ==========================================

    const storedUser =
        localStorage.getItem("loggedInUser");


    // If user isn't logged in
    if (!storedUser) {

        window.location.href =
            "login.html";

    }


    const user =
        JSON.parse(storedUser);


    // Display user name
    document.getElementById("userName")
        .textContent = user.name;


    // Load vehicles
    loadVehicles();


    // ==========================================
    // LOAD VEHICLES
    // ==========================================

    async function loadVehicles() {

        const container =
            document.getElementById(
                "vehiclesContainer"
            );


        // Show loading
        container.innerHTML = `
            <div class="loading">
                Loading vehicles...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `/api/vehicles/user/${user.id}`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load vehicles"
                );

            }


            const vehicles =
                await response.json();


            // ==================================
            // NO VEHICLES
            // ==================================

            if (vehicles.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <h3>
                            No vehicles found
                        </h3>

                        <p>
                            Add your first vehicle
                            to generate a QR code.
                        </p>

                    </div>

                `;

                return;

            }


            // Clear container
            container.innerHTML = "";


            // ==================================
            // DISPLAY VEHICLES
            // ==================================

            vehicles.forEach(vehicle => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "vehicle-card";


                card.innerHTML = `

                    <h3>
                        🚗 ${escapeHtml(
                            vehicle.model || "Vehicle"
                        )}
                    </h3>


                    <div class="vehicle-info">

                        <strong>
                            Registration:
                        </strong>

                        ${escapeHtml(
                            vehicle.registrationNumber
                        )}

                    </div>


                    <div class="vehicle-info">

                        <strong>
                            Color:
                        </strong>

                        ${escapeHtml(
                            vehicle.color || "Not specified"
                        )}

                    </div>


                    <!-- ======================
                         ACTION BUTTONS
                    ======================= -->

                    <div class="vehicle-actions">


                        <!-- PUBLIC PAGE -->

                        <a
                            class="action-button public-button"
                            href="/vehicle.html?id=${vehicle.id}"
                            target="_blank">

                            📱 Public Page

                        </a>


                        <!-- QR CODE -->

                        <button
                            class="action-button qr-button"
                            onclick="toggleQR(
                                ${vehicle.id},
                                this
                            )">

                            🖼️ View QR

                        </button>


                        <!-- EMERGENCY CONTACTS -->

                        <button
                            class="action-button contact-button"
                            onclick="manageContacts(
                                ${vehicle.id}
                            )">

                            🚨 Emergency Contacts

                        </button>


                        <!-- EDIT -->

                        <button
                            class="action-button edit-button"
                            onclick="editVehicle(
                                ${vehicle.id}
                            )">

                            ✏️ Edit

                        </button>


                        <!-- DELETE -->

                        <button
                            class="action-button delete-button"
                            onclick="deleteVehicle(
                                ${vehicle.id}
                            )">

                            🗑️ Delete

                        </button>

                    </div>


                    <!-- ======================
                         QR IMAGE
                    ======================= -->

                    <div
                        class="qr-container"
                        id="qr-${vehicle.id}">

                        <img
                            src="${vehicle.qrCode}"
                            alt="Vehicle QR Code">

                        <p>
                            Scan this QR code to
                            view the vehicle information.
                        </p>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        catch (error) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Error
                    </h3>

                    <p>
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                </div>

            `;

        }

    }


    // ==========================================
    // SHOW / HIDE QR
    // ==========================================

    function toggleQR(
        vehicleId,
        button
    ) {

        const qrContainer =
            document.getElementById(
                `qr-${vehicleId}`
            );


        if (!qrContainer) {
            return;
        }


        if (
            qrContainer.style.display ===
            "block"
        ) {

            qrContainer.style.display =
                "none";


            button.textContent =
                "🖼️ View QR";

        }

        else {

            qrContainer.style.display =
                "block";


            button.textContent =
                "❌ Hide QR";

        }

    }


    // ==========================================
    // ADD VEHICLE
    // ==========================================

    function addVehicle() {

        window.location.href =
            "add-vehicle.html";

    }


    // ==========================================
    // MANAGE EMERGENCY CONTACTS
    // ==========================================

    function manageContacts(vehicleId) {

        window.location.href =
            `emergency-contacts.html?vehicleId=${vehicleId}`;

    }


    // ==========================================
    // EDIT VEHICLE
    // ==========================================

    function editVehicle(vehicleId) {

        window.location.href =
            `edit-vehicle.html?id=${vehicleId}`;

    }


    // ==========================================
    // DELETE VEHICLE
    // ==========================================

    async function deleteVehicle(vehicleId) {


        const confirmation =
            confirm(
                "Are you sure you want to delete this vehicle?\n\n" +
                "This will also remove its QR code reference."
            );


        if (!confirmation) {

            return;

        }


        try {


            const response =
                await fetch(
                    `/api/vehicles/${vehicleId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Unable to delete vehicle"
                );

            }


            alert(
                "Vehicle deleted successfully."
            );


            // Reload vehicle list
            loadVehicles();

        }


        catch (error) {

            alert(
                "Error: " +
                error.message
            );

        }

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {

        localStorage.removeItem(
            "loggedInUser"
        );


        window.location.href =
            "login.html";

    }


    // ==========================================
    // BASIC HTML ESCAPING
    // ==========================================

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


</script>

</body>

</html>
