<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehicle QR - Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
        }

        .logout-button {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #e5e7eb;
        }

        /* ==========================================
           ADD VEHICLE
        ========================================== */

        .add-section {
            margin-bottom: 20px;
        }

        .add-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        /* ==========================================
           VEHICLES
        ========================================== */

        .section-title {
            margin-bottom: 15px;
            font-size: 21px;
        }

        .vehicle-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .vehicle-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .vehicle-info {
            margin-bottom: 7px;
            color: #555;
        }

        /* ==========================================
           QR CONTAINER
        ========================================== */

        .qr-container {
            display: none;

            text-align: center;

            margin-top: 20px;
            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .qr-container img {
            width: 220px;
            height: 220px;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        .qr-container p {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .print-qr-button {
            margin-top: 15px;

            padding: 12px 24px;

            border: none;
            border-radius: 9px;

            background: #111827;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .print-qr-button:hover {
            opacity: 0.9;
        }

        /* ==========================================
           ACTIONS
        ========================================== */

        .vehicle-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .action-button {
            padding: 11px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        .public-button {
            background: #2563eb;
            color: white;
        }

        .qr-button {
            background: #7c3aed;
            color: white;
        }

        .contact-button {
            background: #dc2626;
            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
        }

        .delete-button {
            background: #374151;
            color: white;
        }

        .action-button:hover {
            opacity: 0.9;
        }

        /* ==========================================
           LOADING
        ========================================== */

        .loading {
            text-align: center;
            padding: 30px;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .logout-button {
                width: 100%;
            }

            .vehicle-actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- ==========================================
         HEADER
    ========================================== -->

    <div class="header">

        <div>

            <h1>
                🚗 Vehicle QR
            </h1>

            <p>

                Welcome,
                <strong id="userName">
                    User
                </strong>
                👋

            </p>

        </div>


        <button
                class="logout-button"
                onclick="logout()">

            Logout

        </button>

    </div>


    <!-- ==========================================
         ADD VEHICLE
    ========================================== -->

    <div class="add-section">

        <button
                class="add-button"
                onclick="addVehicle()">

            ➕ Add Vehicle

        </button>

    </div>


    <!-- ==========================================
         VEHICLES
    ========================================== -->

    <h2 class="section-title">

        My Vehicles

    </h2>


    <div id="vehiclesContainer">

        <div class="loading">

            Loading vehicles...

        </div>

    </div>

</div>


<script>

    // =========================================================
    // LIVE WEBSITE
    // =========================================================

    /*
     * This is the public Railway URL of your application.
     *
     * The print template will ALWAYS display this URL,
     * even when you are testing the application locally.
     */

    const LIVE_BASE_URL =
        "https://vehicle-qr-system-production-a2ef.up.railway.app";


    const PROJECT_NAME =
        "Vehicle QR System";


    // =========================================================
    // GET LOGGED-IN USER
    // =========================================================

    const storedUser =
        localStorage.getItem("loggedInUser");


    if (!storedUser) {

        window.location.href =
            "login.html";

    }


    const user =
        JSON.parse(storedUser);


    document.getElementById("userName")
        .textContent = user.name;


    // =========================================================
    // LOAD VEHICLES
    // =========================================================

    loadVehicles();


    async function loadVehicles() {

        const container =
            document.getElementById(
                "vehiclesContainer"
            );


        try {

            const response =
                await fetch(
                    `/api/vehicles/user/${user.id}`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load vehicles"
                );

            }


            const vehicles =
                await response.json();


            // =================================================
            // NO VEHICLES
            // =================================================

            if (vehicles.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <h3>
                            No vehicles found
                        </h3>

                        <p>
                            Add your first vehicle
                            to generate a QR code.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            // =================================================
            // DISPLAY VEHICLES
            // =================================================

            vehicles.forEach(vehicle => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "vehicle-card";


                card.innerHTML = `

                    <h3>

                        🚗
                        ${vehicle.model || "Vehicle"}

                    </h3>


                    <div class="vehicle-info">

                        <strong>
                            Registration:
                        </strong>

                        ${vehicle.registrationNumber}

                    </div>


                    <div class="vehicle-info">

                        <strong>
                            Color:
                        </strong>

                        ${vehicle.color || "Not specified"}

                    </div>


                    <!-- ==================================
                         ACTION BUTTONS
                    ================================== -->

                    <div class="vehicle-actions">


                        <!-- PUBLIC PAGE -->

                        <a

                            class="action-button public-button"

                            href="/vehicle.html?id=${vehicle.id}"

                            target="_blank">

                            📱 Public Page

                        </a>


                        <!-- VIEW QR -->

                        <button

                            class="action-button qr-button"

                            onclick="toggleQR(
                                ${vehicle.id},
                                this
                            )">

                            🖼️ View QR

                        </button>


                        <!-- EMERGENCY CONTACTS -->

                        <button

                            class="action-button contact-button"

                            onclick="manageContacts()">

                            🚨 Emergency Contacts

                        </button>


                        <!-- EDIT -->

                        <button

                            class="action-button edit-button"

                            onclick="editVehicle(
                                ${vehicle.id}
                            )">

                            ✏️ Edit

                        </button>


                        <!-- DELETE -->

                        <button

                            class="action-button delete-button"

                            onclick="deleteVehicle(
                                ${vehicle.id}
                            )">

                            🗑️ Delete

                        </button>

                    </div>


                    <!-- ==================================
                         QR IMAGE
                    ================================== -->

                    <div

                        class="qr-container"

                        id="qr-${vehicle.id}">


                        <img

                            src="${vehicle.qrCode}"

                            alt="Vehicle QR Code">


                        <p>

                            Scan this QR code to
                            view the vehicle information.

                        </p>


                        <!-- PRINT BUTTON -->

                        <button

                            class="print-qr-button"

                            onclick="printQR(
                                ${vehicle.id},
                                '${escapeForJs(vehicle.qrCode)}'
                            )">

                            🖨️ Print QR

                        </button>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        catch (error) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Error
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    // =========================================================
    // ESCAPE URL FOR INLINE JAVASCRIPT
    // =========================================================

    function escapeForJs(value) {

        return String(value)

            .replace(
                /\\/g,
                "\\\\"
            )

            .replace(
                /'/g,
                "\\'"
            );

    }


    // =========================================================
    // SHOW / HIDE QR
    // =========================================================

    function toggleQR(
            vehicleId,
            button) {

        const qrContainer =
            document.getElementById(
                `qr-${vehicleId}`
            );


        if (
            qrContainer.style.display ===
            "block"
        ) {

            qrContainer.style.display =
                "none";


            button.textContent =
                "🖼️ View QR";

        }

        else {

            qrContainer.style.display =
                "block";


            button.textContent =
                "❌ Hide QR";

        }

    }


    // =========================================================
    // PRINT QR
    // =========================================================

    function printQR(
            vehicleId,
            qrCodePath) {


        /*
         * Convert the QR path into a complete URL.
         *
         * Example:
         *
         * /qrcodes/vehicle-11.png
         *
         * becomes:
         *
         * https://vehicle-qr-system-production-a2ef.up.railway.app
         * /qrcodes/vehicle-11.png
         */

        const qrUrl =
            new URL(
                qrCodePath,
                window.location.origin
            ).href;


        /*
         * This is the URL that should be shown
         * on the printed poster.
         */

        const vehicleUrl =
            `${LIVE_BASE_URL}/vehicle.html?id=${vehicleId}`;


        /*
         * Open print window.
         */

        const printWindow =
            window.open(
                "",
                "_blank",
                "width=900,height=1100"
            );


        if (!printWindow) {

            alert(
                "Please allow pop-ups to print the QR."
            );

            return;

        }


        printWindow.document.write(`

        }

        .website-bar {

        /* =========================================

        .info-box {

            width: 100%;

            margin-top: 11mm;

            padding:

                5mm;

            border-radius: 12px;

            display: grid;

            grid-template-columns:

                1fr

        }


        .info-item {

            padding: 0 7px;

        }


        .info-item + .info-item {

        }


        .info-icon {

            width: 16mm;

            height: 16mm;

            margin:

            border-radius: 50%;

            background: #123f8c;

            color: white;

            display: flex;

        }


        .info-title {

            margin-bottom: 5px;

        }


        .info-text {

            color: #111;

        }


        /* =========================================

        .vehicle-number {

            margin-top: 4mm;

            font-size: 13px;

        }


        /* =========================================

        .footer {

            margin-top: auto;

        }


        .footer-line {

            display: inline-block;

            width: 45px;

            height: 3px;

            margin:

            background: #123f8c;

            vertical-align: middle;

        }


        /* =========================================
           PRINT
        ========================================= */

        @media print {

            body {

                -webkit-print-color-adjust:
                    exact;

                print-color-adjust:
                    exact;

            }


            .poster {

                margin: 0;

            }

        }


    </style>


</head>


<body>


<div class="poster">


    <div class="inner-border">


        <!-- =====================================
             SCAN ME
        ====================================== -->

        <div class="scan-title">

            SCAN ME

        </div>


        <div class="title-decoration">
        </div>


        <!-- =====================================

        ====================================== -->

        <div class="message">

            please

        </div>


        <!-- =====================================

        <div class="qr-frame">

            <img

                class="qr-image"

                src="${qrUrl}"

        </div>

        <div class="website-bar">

                </div>


                <div class="info-text">

                    Scan to contact
                    the vehicle owner
                    family.

                </div>

            </div>


            <!-- SAFETY -->

            <div class="info-item">

                <div class="info-icon">

                    ✓

                </div>


                <div class="info-title">

                    YOUR SAFETY

                </div>


                <div class="info-text">

                    Your information
                    is safe with us.

                </div>

            </div>


        </div>


        <!-- =====================================
             VEHICLE ID
        ====================================== -->

        <div class="vehicle-number">

            ${vehicleId}

        </div>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <div class="footer">

            <span class="footer-line">
            </span>

            Thank you for your cooperation!

            <span class="footer-line">
            </span>

        </div>


    </div>

</div>


<script>

    /*
     * Wait until the QR image is loaded
     * before opening the print dialog.
     */

    const qrImage =
        document.querySelector(
            ".qr-image"
        );


    qrImage.onload =
        function() {

            window.print();

        };


    qrImage.onerror =
        function() {

            alert(
                "Unable to load the QR code."
            );

        };

<\/script>


</body>

</html>

        `);


        printWindow.document.close();

    }


    // =========================================================
    // ADD VEHICLE
    // =========================================================

    function addVehicle() {

        window.location.href =
            "add-vehicle.html";

    }


    // =========================================================
    // MANAGE EMERGENCY CONTACTS
    // =========================================================

    function manageContacts() {

        window.location.href =
            "emergency-contacts.html";

    }


    // =========================================================
    // EDIT VEHICLE
    // =========================================================

    function editVehicle(
            vehicleId) {

        window.location.href =
            `edit-vehicle.html?id=${vehicleId}`;

    }


    // =========================================================
    // DELETE VEHICLE
    // =========================================================

    async function deleteVehicle(
            vehicleId) {


        const confirmation =
            confirm(
                "Are you sure you want to delete this vehicle?"
            );


        if (!confirmation) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/vehicles/${vehicleId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to delete vehicle"
                );

            }


            alert(
                "Vehicle deleted successfully."
            );


            loadVehicles();

        }


        catch (error) {

            alert(
                "Error: " +
                error.message
            );

        }

    }


    // =========================================================
    // LOGOUT
    // =========================================================

    function logout() {

        localStorage.removeItem(
            "loggedInUser"
        );


        window.location.href =
            "login.html";

    }

</script>


</body>

</html>
