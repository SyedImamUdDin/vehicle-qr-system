<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehicle QR - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 50px;
        }

        .logo h1 {
            margin-top: 8px;
            font-size: 26px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #555;
        }

        .login-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .register-link a {
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="logo">

        <div class="logo-icon">
            🚗
        </div>

        <h1>Vehicle QR</h1>

        <p>Emergency Vehicle System</p>

    </div>


    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton">

            Login

        </button>


        <div id="message"></div>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const loginButton =
        document.getElementById("loginButton");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email")
                    .value;

            const password =
                document.getElementById("password")
                    .value;


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            message.textContent = "";


            try {

                const response =
                    await fetch(
                        "/api/users/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(error);
                }


                const user =
                    await response.json();


                /*
                 * Store logged-in user
                 * information in browser.
                 */
                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(user)
                );


                // Go to dashboard
                window.location.href =
                    "dashboard.html";

            }

            catch (error) {

                message.textContent =
                    error.message ||
                    "Login failed.";

            }

            finally {

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>

</body>

</html>
