<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Vehicle QR</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .icon {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            margin-top: 10px;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            color: #777;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 22px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;

            margin-top: 18px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🔐
    </div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your email address and we will send
        you a password reset code.
    </p>

    <form id="forgotForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

        </div>

        <button
                type="submit"
                id="sendButton">

            Send Reset Code

        </button>

        <div id="message"></div>

    </form>

    <div class="back">

        <a href="login.html">
            Back to Login
        </a>

    </div>

</div>

<script>

    const forgotForm =
        document.getElementById("forgotForm");

    const sendButton =
        document.getElementById("sendButton");

    const message =
        document.getElementById("message");


    forgotForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value.trim();


                sendButton.disabled = true;

                sendButton.textContent =
                        "Sending...";

                message.textContent = "";


                try {

                    const response =
                        await fetch(
                            "/api/users/forgot-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                            "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email
                                    })
                            }
                        );


                    const text =
                        await response.text();


                    if (!response.ok) {

                        throw new Error(text);
                    }


                    const data =
                        JSON.parse(text);


                    localStorage.setItem(
                            "resetEmail",
                            data.email
                    );


                    message.textContent =
                            data.message;

                    message.style.color =
                            "green";


                    setTimeout(
                            function() {

                                window.location.href =
                                        "reset-password.html";

                            },
                            1200
                    );

                } catch (error) {

                    message.textContent =
                            error.message ||
                            "Unable to send reset code.";

                    message.style.color =
                            "red";

                } finally {

                    sendButton.disabled = false;

                    sendButton.textContent =
                            "Send Reset Code";
                }

            }
    );

</script>

</body>

</html>
