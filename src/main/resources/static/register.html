<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Vehicle QR</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 45px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
        }

        .subtitle {
            margin-top: 7px;
            color: #777;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #222;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            padding: 0;
            background: transparent;
            color: #555;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .toggle-password:hover {
            background: transparent;
            opacity: 0.8;
        }

        .password-hint {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 12px;
            line-height: 1.4;
        }

        .password-status {
            margin-top: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: #dc2626;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button {
            background: #222;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="icon">🚗</div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register for Vehicle QR Emergency System
            </p>

        </div>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required>

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                        type="tel"
                        id="phone"
                        placeholder="03001234567"
                        required>

            </div>

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                        type="text"
                        id="city"
                        placeholder="Rawalpindi"
                        required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            placeholder="Create a strong password"
                            required>

                    <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password">

                        👁

                    </button>

                </div>

                <small class="password-hint">

                    Must contain at least 8 characters,
                    uppercase, lowercase, number and special character.

                </small>

                <div id="passwordStatus"
                     class="password-status"></div>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Enter password again"
                            required>

                    <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>

            <button
                    type="submit"
                    class="register-button"
                    id="registerButton">

                Register

            </button>

            <div
                    id="message"
                    class="message">
            </div>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script>

    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const passwordStatus =
        document.getElementById("passwordStatus");


    function isStrongPassword(password) {

        return password.length >= 8 &&
               /[A-Z]/.test(password) &&
               /[a-z]/.test(password) &&
               /[0-9]/.test(password) &&
               /[^A-Za-z0-9]/.test(password);
    }


    function togglePassword(
            inputId,
            button) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

            button.setAttribute(
                    "aria-label",
                    "Hide password"
            );

        } else {

            input.type = "password";

            button.textContent = "👁";

            button.setAttribute(
                    "aria-label",
                    "Show password"
            );
        }
    }


    passwordInput.addEventListener(
            "input",
            function() {

                const password =
                    passwordInput.value;

                if (password.length === 0) {

                    passwordStatus.textContent = "";

                    return;
                }

                if (isStrongPassword(password)) {

                    passwordStatus.textContent =
                            "✓ Strong password";

                    passwordStatus.className =
                            "password-status valid";

                } else {

                    passwordStatus.textContent =
                            "✗ Password does not meet the requirements";

                    passwordStatus.className =
                            "password-status invalid";
                }
            }
    );


    form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name")
                        .value.trim();

                const email =
                    document.getElementById("email")
                        .value.trim();

                const phone =
                    document.getElementById("phone")
                        .value.trim();

                const city =
                    document.getElementById("city")
                        .value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (!isStrongPassword(password)) {

                    message.className =
                            "message error";

                    message.textContent =
                            "Password must be at least 8 characters and include uppercase, lowercase, number and special character.";

                    return;
                }


                if (password !== confirmPassword) {

                    message.className =
                            "message error";

                    message.textContent =
                            "Passwords do not match.";

                    return;
                }


                button.disabled = true;

                button.textContent =
                        "Creating Account...";

                message.textContent = "";


                try {

                    const response =
                        await fetch(
                            "/api/users/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                            "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        name: name,
                                        email: email,
                                        phone: phone,
                                        city: city,
                                        password: password,
                                        confirmPassword:
                                                confirmPassword
                                    })
                            }
                        );


                    const text =
                        await response.text();


                    if (!response.ok) {

                        throw new Error(text);
                    }


                    const data =
                        JSON.parse(text);


                    localStorage.setItem(
                            "verificationEmail",
                            data.email
                    );


                    message.className =
                            "message success";

                    message.textContent =
                            "Verification code sent to your email.";


                    setTimeout(
                            function() {

                                window.location.href =
                                        "verify-email.html";

                            },
                            1000
                    );

                } catch (error) {

                    message.className =
                            "message error";

                    message.textContent =
                            error.message ||
                            "Registration failed.";

                } finally {

                    button.disabled = false;

                    button.textContent =
                            "Register";
                }

            }
    );

</script>

</body>

</html>
