<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Vehicle QR</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .icon {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            margin-top: 10px;
        }

        .subtitle {
            text-align: center;
            margin-top: 8px;
            color: #777;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            padding: 0;

            margin: 0;

            background: transparent;

            color: #555;

            border: none;

            font-size: 18px;

            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
        }

        .password-hint {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 12px;
            line-height: 1.4;
        }

        .password-status {
            margin-top: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: #dc2626;
        }

        .reset-button {
            width: 100%;

            padding: 14px;

            margin-top: 22px;

            border: none;

            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🔑
    </div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter the code sent to your email
        and create a new password.
    </p>

    <form id="resetForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    required>

        </div>

        <div class="form-group">

            <label for="code">
                Reset Code
            </label>

            <input
                    type="text"
                    id="code"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="6-digit code"
                    required>

        </div>

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="password-wrapper">

                <input
                        type="password"
                        id="newPassword"
                        placeholder="Create a strong password"
                        required>

                <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)"
                        aria-label="Show password">

                    👁

                </button>

            </div>

            <small class="password-hint">

                8+ characters, uppercase, lowercase,
                number and special character.

            </small>

            <div id="passwordStatus"
                 class="password-status"></div>

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <div class="password-wrapper">

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        required>

                <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password">

                    👁

                </button>

            </div>

        </div>

        <button
                type="submit"
                class="reset-button"
                id="resetButton">

            Reset Password

        </button>

        <div id="message"></div>

    </form>

    <div class="back">

        <a href="login.html">
            Back to Login
        </a>

    </div>

</div>

<script>

    const resetForm =
        document.getElementById("resetForm");

    const resetButton =
        document.getElementById("resetButton");

    const message =
        document.getElementById("message");

    const passwordInput =
        document.getElementById("newPassword");

    const passwordStatus =
        document.getElementById("passwordStatus");


    const resetEmail =
        localStorage.getItem("resetEmail");


    if (resetEmail) {

        document.getElementById("email")
            .value = resetEmail;
    }


    function isStrongPassword(password) {

        return password.length >= 8 &&
               /[A-Z]/.test(password) &&
               /[a-z]/.test(password) &&
               /[0-9]/.test(password) &&
               /[^A-Za-z0-9]/.test(password);
    }


    function togglePassword(
            inputId,
            button) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";
        }
    }


    passwordInput.addEventListener(
            "input",
            function() {

                const password =
                    passwordInput.value;

                if (password.length === 0) {

                    passwordStatus.textContent = "";

                    return;
                }

                if (isStrongPassword(password)) {

                    passwordStatus.textContent =
                            "✓ Strong password";

                    passwordStatus.className =
                            "password-status valid";

                } else {

                    passwordStatus.textContent =
                            "✗ Password does not meet the requirements";

                    passwordStatus.className =
                            "password-status invalid";
                }
            }
    );


    resetForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value.trim();

                const code =
                    document.getElementById("code")
                        .value.trim();

                const newPassword =
                    document.getElementById("newPassword")
                        .value;

                const confirmPassword =
                    document.getElementById("confirmPassword")
                        .value;


                if (!isStrongPassword(newPassword)) {

                    message.textContent =
                            "Password must be at least 8 characters and include uppercase, lowercase, number and special character.";

                    message.style.color =
                            "red";

                    return;
                }


                if (newPassword !== confirmPassword) {

                    message.textContent =
                            "Passwords do not match.";

                    message.style.color =
                            "red";

                    return;
                }


                resetButton.disabled = true;

                resetButton.textContent =
                        "Resetting...";

                message.textContent = "";


                try {

                    const response =
                        await fetch(
                            "/api/users/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                            "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        email: email,
                                        code: code,
                                        newPassword: newPassword,
                                        confirmPassword:
                                                confirmPassword

                                    })
                            }
                        );


                    const text =
                        await response.text();


                    if (!response.ok) {

                        throw new Error(text);
                    }


                    message.textContent =
                            text;

                    message.style.color =
                            "green";


                    localStorage.removeItem(
                            "resetEmail"
                    );


                    setTimeout(
                            function() {

                                window.location.href =
                                        "login.html";

                            },
                            1500
                    );

                } catch (error) {

                    message.textContent =
                            error.message ||
                            "Password reset failed.";

                    message.style.color =
                            "red";

                } finally {

                    resetButton.disabled = false;

                    resetButton.textContent =
                            "Reset Password";
                }

            }
    );

</script>

</body>

</html>
